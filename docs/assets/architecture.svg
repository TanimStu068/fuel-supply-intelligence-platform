<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" font-family="'Liberation Sans','DejaVu Sans',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e6522c"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1010" fill="#ffffff"/>

  <!-- ── Title ───────────────────────────────────────────────────────────── -->
  <text x="40" y="52" font-size="29" font-weight="700" fill="#0f172a">Fuel Supply Intelligence &amp; Resilience Platform</text>
  <text x="40" y="80" font-size="14" fill="#64748b">System architecture — every box below is served by a single <tspan font-family="'DejaVu Sans Mono','Liberation Mono',monospace">docker compose up</tspan></text>

  <!-- ── Platform group ──────────────────────────────────────────────────── -->
  <rect x="32" y="104" width="1040" height="748" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="9 6"/>
  <text x="52" y="133" font-size="11.5" font-weight="700" letter-spacing="2.2" fill="#64748b">OUR PLATFORM · DOCKER COMPOSE</text>
  <text x="1052" y="133" font-size="11" text-anchor="end" fill="#94a3b8">solid line = request path&#160;&#160;·&#160;&#160;dashed = event hint</text>

  <!-- ── Operator ────────────────────────────────────────────────────────── -->
  <rect x="60" y="168" width="300" height="118" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
  <rect x="76" y="186" width="8" height="8" rx="2" fill="#64748b"/>
  <text x="92" y="194" font-size="12.5" font-weight="700" letter-spacing="0.6" fill="#0f172a">OPERATOR</text>
  <text x="76" y="218" font-size="11.5" fill="#475569">Human-in-the-loop by design:</text>
  <text x="76" y="236" font-size="11.5" fill="#475569">every dispatch needs an explicit</text>
  <text x="76" y="254" font-size="11.5" fill="#475569">approval — and can be rejected.</text>
  <line x1="210" y1="288" x2="210" y2="304" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ── Frontend ────────────────────────────────────────────────────────── -->
  <rect x="60" y="310" width="300" height="346" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
  <rect x="76" y="328" width="8" height="8" rx="2" fill="#2563eb"/>
  <text x="92" y="336" font-size="12.5" font-weight="700" letter-spacing="0.6" fill="#0f172a">OPERATOR DASHBOARD</text>
  <text x="76" y="356" font-size="11" fill="#64748b">React 18 · Vite · TypeScript · static server</text>
  <line x1="76" y1="368" x2="344" y2="368" stroke="#eef2f7" stroke-width="1.4"/>
  <text x="76" y="392" font-size="11.5" fill="#475569">• 9 operator screens</text>
  <text x="76" y="414" font-size="11.5" fill="#475569">• polls the backend every 5 s</text>
  <text x="76" y="436" font-size="11.5" fill="#475569">• loading &amp; error state per view</text>
  <text x="76" y="458" font-size="11.5" fill="#475569">• DEGRADED / STALE banner with age</text>
  <text x="76" y="480" font-size="11.5" fill="#475569">• responsive down to 430 px</text>
  <text x="76" y="502" font-size="11.5" fill="#475569">• what-if preview writes nothing</text>
  <line x1="76" y1="518" x2="344" y2="518" stroke="#eef2f7" stroke-width="1.4"/>
  <text x="76" y="538" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#94a3b8">SCREENS</text>
  <text x="76" y="558" font-size="10.8" fill="#64748b">Overview · Network · Inventory · Risk</text>
  <text x="76" y="576" font-size="10.8" fill="#64748b">Recommendations · Supply &amp; events</text>
  <text x="76" y="594" font-size="10.8" fill="#64748b">Decision history · Service health</text>
  <text x="76" y="612" font-size="10.8" fill="#64748b">Simulation controls</text>

  <!-- ── Principles ──────────────────────────────────────────────────────── -->
  <rect x="60" y="690" width="300" height="140" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
  <rect x="76" y="708" width="8" height="8" rx="2" fill="#0f172a"/>
  <text x="92" y="716" font-size="12.5" font-weight="700" letter-spacing="0.6" fill="#0f172a">PRINCIPLES</text>
  <text x="76" y="740" font-size="11" fill="#475569">• REST is truth, SSE is only a hint</text>
  <text x="76" y="760" font-size="11" fill="#475569">• Nothing ships without approval</text>
  <text x="76" y="780" font-size="11" fill="#475569">• Degraded mode keeps the UI alive</text>
  <text x="76" y="800" font-size="11" fill="#475569">• Every response is validated</text>

  <!-- ── Frontend → Backend ──────────────────────────────────────────────── -->
  <line x1="364" y1="420" x2="462" y2="420" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="414" y="411" font-size="10" text-anchor="middle" fill="#64748b">REST /api</text>

  <!-- ── Backend ─────────────────────────────────────────────────────────── -->
  <rect x="470" y="150" width="560" height="470" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <path d="M 482 150 H 1018 A 12 12 0 0 1 1030 162 V 196 H 470 V 162 A 12 12 0 0 1 482 150 Z" fill="#0f172a"/>
  <text x="490" y="179" font-size="13" font-weight="700" letter-spacing="0.8" fill="#ffffff">BACKEND · FastAPI · :8001</text>
  <text x="1010" y="179" font-size="10.5" text-anchor="end" fill="#94a3b8">async · cached reads · strict models</text>

  <rect x="490" y="214" width="520" height="86" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="508" y="236" font-size="11.5" font-weight="700" letter-spacing="0.9" fill="#0f172a">SYNC SERVICE</text>
  <text x="508" y="257" font-size="11" fill="#475569">REST poll every 5 s + SSE listener on /v1/stream</text>
  <text x="508" y="276" font-size="11" fill="#475569">cached state, stale flag, degraded mode with data age</text>

  <rect x="490" y="312" width="520" height="86" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="508" y="334" font-size="11.5" font-weight="700" letter-spacing="0.9" fill="#0f172a">INTELLIGENCE LAYER</text>
  <text x="508" y="355" font-size="11" fill="#475569">demand forecast with confidence band, hours-to-stockout</text>
  <text x="508" y="374" font-size="11" fill="#475569">anomaly, bottleneck and shortage detection · rule-based fallback</text>

  <rect x="490" y="410" width="520" height="86" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="508" y="432" font-size="11.5" font-weight="700" letter-spacing="0.9" fill="#0f172a">DECISION ENGINE</text>
  <text x="508" y="453" font-size="11" fill="#475569">constraint-aware allocator: routes, capacity, inventory, closures</text>
  <text x="508" y="472" font-size="11" fill="#475569">ranked alternatives · fallback policy when intelligence is down</text>

  <rect x="490" y="508" width="520" height="92" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="508" y="530" font-size="11.5" font-weight="700" letter-spacing="0.9" fill="#0f172a">APPROVAL, WHAT-IF &amp; AUDIT</text>
  <text x="508" y="551" font-size="11" fill="#475569">simulate (writes nothing) → approve → POST /v1/allocations, or reject</text>
  <text x="508" y="570" font-size="11" fill="#475569">decision history, outcomes, audit trail, idempotency keys</text>

  <!-- ── Backend → Postgres ──────────────────────────────────────────────── -->
  <line x1="750" y1="622" x2="750" y2="654" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <text x="762" y="645" font-size="10.5" fill="#0f766e">SQL</text>

  <rect x="470" y="660" width="560" height="112" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
  <rect x="486" y="678" width="8" height="8" rx="2" fill="#0f766e"/>
  <text x="502" y="686" font-size="12.5" font-weight="700" letter-spacing="0.6" fill="#0f172a">POSTGRES · :5432</text>
  <text x="486" y="714" font-size="11" fill="#475569">inventory snapshots · demand history · allocations · events</text>
  <text x="486" y="732" font-size="11" fill="#475569">alerts · decisions · system health · Alembic migrations</text>

  <!-- ── Backend ↔ Simulator ─────────────────────────────────────────────── -->
  <line x1="1036" y1="230" x2="1172" y2="230" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1104" y="221" font-size="10" text-anchor="middle" fill="#64748b">REST reads</text>

  <line x1="1172" y1="300" x2="1036" y2="300" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-amber)"/>
  <text x="1104" y="291" font-size="10" text-anchor="middle" fill="#b45309">SSE hints</text>

  <line x1="1036" y1="370" x2="1172" y2="370" stroke="#0f766e" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <text x="1104" y="361" font-size="10" text-anchor="middle" fill="#0f766e">allocations</text>

  <!-- ── Simulator ───────────────────────────────────────────────────────── -->
  <rect x="1180" y="150" width="380" height="320" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1.6"/>
  <rect x="1196" y="166" width="214" height="19" rx="9.5" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="1303" y="179" font-size="9" font-weight="700" letter-spacing="0.7" text-anchor="middle" fill="#b45309">ORGANIZER-PROVIDED · UNMODIFIED</text>
  <text x="1196" y="213" font-size="12.5" font-weight="700" letter-spacing="0.5" fill="#0f172a">BUP FUEL SUPPLY SIMULATOR</text>
  <text x="1196" y="235" font-size="11" fill="#475569">2 regions · 2 depots · 4 stations · 6 routes</text>
  <text x="1196" y="253" font-size="11" fill="#475569">Diesel · Petrol · Octane · tick-based clock</text>
  <line x1="1196" y1="267" x2="1544" y2="267" stroke="#eef2f7" stroke-width="1.4"/>
  <text x="1196" y="288" font-size="10" fill="#334155" font-family="'DejaVu Sans Mono','Liberation Mono',monospace">GET  /v1/instance · /v1/stations · /v1/routes</text>
  <text x="1196" y="306" font-size="10" fill="#334155" font-family="'DejaVu Sans Mono','Liberation Mono',monospace">GET  /v1/depots · /v1/events · /v1/metrics</text>
  <text x="1196" y="324" font-size="10" fill="#334155" font-family="'DejaVu Sans Mono','Liberation Mono',monospace">GET  /v1/demand-history · /v1/stream (SSE)</text>
  <text x="1196" y="342" font-size="10" fill="#334155" font-family="'DejaVu Sans Mono','Liberation Mono',monospace">POST /v1/allocations · /v1/allocations/{id}/cancel</text>
  <text x="1196" y="360" font-size="10" fill="#334155" font-family="'DejaVu Sans Mono','Liberation Mono',monospace">POST /admin/run|pause|step|reset|events|faults</text>
  <line x1="1196" y1="374" x2="1544" y2="374" stroke="#eef2f7" stroke-width="1.4"/>
  <text x="1196" y="396" font-size="10.5" font-style="italic" fill="#64748b">The world. It never predicts, optimizes or decides.</text>
  <text x="1196" y="416" font-size="10.5" fill="#64748b">Every write to it is gated by a human approval.</text>
  <text x="1196" y="436" font-size="10.5" fill="#64748b">The published image is never modified.</text>

  <!-- ── Backend → Prometheus ────────────────────────────────────────────── -->
  <line x1="1034" y1="536" x2="1172" y2="536" stroke="#e6522c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="1104" y="527" font-size="10" text-anchor="middle" fill="#e6522c">scrape /metrics</text>

  <rect x="1180" y="470" width="380" height="132" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
  <rect x="1196" y="488" width="8" height="8" rx="2" fill="#e6522c"/>
  <text x="1212" y="496" font-size="12.5" font-weight="700" letter-spacing="0.6" fill="#0f172a">PROMETHEUS · :9090</text>
  <text x="1196" y="524" font-size="10.8" fill="#475569">scrapes /metrics every 15 s</text>
  <text x="1196" y="544" font-size="10.8" fill="#475569">request rate · latency histogram · error rate</text>
  <text x="1196" y="564" font-size="10.8" fill="#475569">SSE reconnects · stale count · last-sync age</text>
  <text x="1196" y="584" font-size="10.8" fill="#475569">decisions per minute · approval rate · fallbacks</text>

  <!-- ── Prometheus → Grafana ────────────────────────────────────────────── -->
  <line x1="1370" y1="604" x2="1370" y2="640" stroke="#e6522c" stroke-width="1.6" marker-end="url(#arrow-red)"/>
  <text x="1380" y="627" font-size="10" fill="#e6522c">dashboards</text>

  <rect x="1180" y="646" width="380" height="132" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
  <rect x="1196" y="664" width="8" height="8" rx="2" fill="#f46800"/>
  <text x="1212" y="672" font-size="12.5" font-weight="700" letter-spacing="0.6" fill="#0f172a">GRAFANA · :3000</text>
  <text x="1196" y="700" font-size="10.8" fill="#475569">provisioned dashboards and alert rules</text>
  <text x="1196" y="720" font-size="10.8" fill="#475569">Application · System · Intelligence</text>
  <text x="1196" y="740" font-size="10.8" fill="#475569">Integration · decision and flow dashboards</text>
  <text x="1196" y="760" font-size="10.8" fill="#475569">login: admin / password in .env</text>

  <!-- ── The operating loop ──────────────────────────────────────────────── -->
  <rect x="32" y="876" width="1528" height="104" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="56" y="902" font-size="11" font-weight="700" letter-spacing="2" fill="#64748b">THE OPERATING LOOP</text>

  <g font-size="11.5" font-weight="700" letter-spacing="1" text-anchor="middle">
    <rect x="56" y="916" width="162" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="137" y="940" fill="#0f172a">OBSERVE</text>

    <rect x="244" y="916" width="162" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="325" y="940" fill="#0f172a">DETECT</text>

    <rect x="432" y="916" width="162" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="513" y="940" fill="#0f172a">PREDICT</text>

    <rect x="620" y="916" width="162" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="701" y="940" fill="#0f172a">DECIDE</text>

    <rect x="808" y="916" width="162" height="38" rx="9" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="889" y="940" fill="#b45309">HUMAN APPROVE</text>

    <rect x="996" y="916" width="162" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="1077" y="940" fill="#0f172a">ACT</text>

    <rect x="1184" y="916" width="162" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="1265" y="940" fill="#0f172a">MONITOR</text>

    <rect x="1372" y="916" width="162" height="38" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="1453" y="940" fill="#0f172a">RECOVER</text>
  </g>

  <g stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)">
    <line x1="222" y1="935" x2="238" y2="935"/>
    <line x1="410" y1="935" x2="426" y2="935"/>
    <line x1="598" y1="935" x2="614" y2="935"/>
    <line x1="786" y1="935" x2="802" y2="935"/>
    <line x1="974" y1="935" x2="990" y2="935"/>
    <line x1="1162" y1="935" x2="1178" y2="935"/>
    <line x1="1350" y1="935" x2="1366" y2="935"/>
  </g>
</svg>
