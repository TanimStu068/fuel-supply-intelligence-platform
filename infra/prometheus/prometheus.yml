# Prometheus configuration for the fuel supply platform.
#
# Three scrape jobs:
#
#   fuel-backend   the platform's own metrics
#   node-exporter  the host's CPU and memory
#   prometheus     Prometheus's own scrape health
#
# The alert rules in ``alerts.yml`` are loaded from the same directory, so a
# rule is part of the code rather than something clicked into the UI at 2am
# during a demo.
#
# **Why node-exporter and not cAdvisor.** cAdvisor's ``/api/v1.3/docker``
# endpoint returns ``{}`` in this environment, so Prometheus received one
# host-level series with the id ``/`` and no per-container breakdown. It
# also cost 384 MB. node-exporter reads the kernel's own counters — the
# same numbers ``free`` and ``top`` report — for 32 MB, and it works.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: fuel-supply-intelligence
    environment: docker-compose

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fuel-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: fuel-backend
          environment: docker-compose

  # The host's CPU, memory, disk and network. node-exporter reads the
  # kernel's counters through a read-only mount of the host's root, so
  # the numbers are the host's and not the container's.
  - job_name: node
    metrics_path: /metrics
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
