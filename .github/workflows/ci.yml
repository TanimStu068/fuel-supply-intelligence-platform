name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install ruff
        run: pip install --upgrade pip ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format --check
        run: ruff format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: fuel-supply-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: fuel-supply-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the backend image
        run: |
          set -euo pipefail
          # The backend's /health is a *readiness* probe: it reports 503 while
          # the simulator or the database are down. So the smoke test brings
          # up the real dependencies alongside the freshly built image.
          docker network create fuel-ci-net || true

          docker run -d --name fuel-ci-simulator --network fuel-ci-net \
            -e SIMULATOR_START_MODE=paused \
            asifmahmoud414/bup-fuel-supply-simulator:1.0.0
          docker run -d --name fuel-ci-postgres --network fuel-ci-net \
            -e POSTGRES_USER=fuel -e POSTGRES_PASSWORD=fuel -e POSTGRES_DB=fuel \
            postgres:16-alpine
          docker run -d --name fuel-backend-ci --network fuel-ci-net -p 18001:8000 \
            -e SIMULATOR_BASE_URL=http://fuel-ci-simulator:8000 \
            -e DATABASE_URL=postgresql+asyncpg://fuel:fuel@fuel-ci-postgres:5432/fuel \
            fuel-supply-backend:ci

          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18001/health > /dev/null 2>&1; then
              echo "backend healthy after ${i}s"
              curl -fsS http://127.0.0.1:18001/health
              echo
              curl -fsS http://127.0.0.1:18001/api/state | head -c 400
              echo
              break
            fi
            if [ "$i" -eq 45 ]; then
              echo "backend did not become healthy"
              docker logs fuel-backend-ci
              exit 1
            fi
            sleep 2
          done

          docker rm -f fuel-backend-ci fuel-ci-simulator fuel-ci-postgres

  compose-config:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet
