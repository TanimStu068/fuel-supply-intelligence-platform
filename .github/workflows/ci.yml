name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install ruff
        run: pip install --upgrade pip ruff

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format --check
        run: ruff format --check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest -q --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build
        run: npm run build

  frontend-e2e:
    name: Frontend e2e (playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Install Playwright
        run: npm run test:e2e:install

      - name: Build
        run: npm run build

      # The e2e tests need the backend to answer, so the whole stack is
      # brought up: the organizer-provided simulator, Postgres, the
      # backend and the frontend.
      - name: Start the stack
        run: docker compose up -d --wait

      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload the failure artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: fuel-supply-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: fuel-supply-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the backend image
        run: |
          set -euo pipefail
          # The backend's /health is a *readiness* probe: it reports 503 while
          # the simulator or the database are down. So the smoke test brings
          # up the real dependencies alongside the freshly built image.
          docker network create fuel-ci-net || true

          docker run -d --name fuel-ci-simulator --network fuel-ci-net \
            -e SIMULATOR_START_MODE=paused \
            asifmahmoud414/bup-fuel-supply-simulator:1.0.0
          docker run -d --name fuel-ci-postgres --network fuel-ci-net \
            -e POSTGRES_USER=fuel -e POSTGRES_PASSWORD=fuel -e POSTGRES_DB=fuel \
            postgres:16-alpine
          docker run -d --name fuel-backend-ci --network fuel-ci-net -p 18001:8000 \
            -e SIMULATOR_BASE_URL=http://fuel-ci-simulator:8000 \
            -e DATABASE_URL=postgresql+asyncpg://fuel:fuel@fuel-ci-postgres:5432/fuel \
            fuel-supply-backend:ci

          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18001/health > /dev/null 2>&1; then
              echo "backend healthy after ${i}s"
              curl -fsS http://127.0.0.1:18001/health
              echo
              curl -fsS http://127.0.0.1:18001/api/state | head -c 400
              echo
              break
            fi
            if [ "$i" -eq 45 ]; then
              echo "backend did not become healthy"
              docker logs fuel-backend-ci
              exit 1
            fi
            sleep 2
          done

          docker rm -f fuel-backend-ci fuel-ci-simulator fuel-ci-postgres

  compose-config:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

  compose-smoke:
    name: Compose smoke test (/health)
    runs-on: ubuntu-latest
    needs: [compose-config]
    steps:
      - uses: actions/checkout@v4

      # The one command a judge runs. If this passes, the README's quick
      # start works from a clean checkout.
      - name: Copy the example environment
        run: cp .env.example .env

      - name: Bring the stack up
        run: docker compose up -d --wait --wait-timeout 300

      # /health is a *readiness* probe: it answers 503 while the simulator
      # or the database is down. A 200 means the whole stack is working,
      # not just that the process started.
      - name: Check the backend health endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8001/health > /tmp/health.json; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "the backend never became healthy"
              docker compose logs
              exit 1
            fi
            sleep 2
          done
          cat /tmp/health.json
          echo
          python3 scripts/check_health.py /tmp/health.json

      - name: Check the dashboard is served
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/)
          echo "dashboard HTTP $code"
          [ "$code" = "200" ]

      - name: Check the API answers with live data
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8001/api/state > /tmp/state.json
          python3 scripts/check_state.py /tmp/state.json

      # The cross-service suite: it checks the live stack end to end.
      - name: Run the integration tests against the live stack
        run: |
          set -euo pipefail
          pip install --upgrade pip pytest httpx
          python -m pytest tests/ -m integration -q

      - name: Dump the logs when something failed
        if: failure()
        run: docker compose logs --no-color

      - name: Tear the stack down
        if: always()
        run: docker compose down -v

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov

      # The four modules the brief names -- the decision engine, the
      # predictor, the simulator client and the fallback -- are held to a
      # floor of 90 %. The overall total is held to 80 %.
      - name: Measure the coverage
        run: |
          pytest -q --cov=app --cov-report=term-missing --cov-report=json:coverage.json

      - name: Enforce the coverage floors
        run: |
          python3 scripts/check_coverage.py backend/coverage.json

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.json
          if-no-files-found: ignore
