name: Release

# Builds the two images and publishes them to the GitHub Container Registry
# with a version tag, a moving tag for the branch, and the immutable
# sha tag. The sha tag is the one a rollback points at, because it is the
# only tag that cannot be moved after the fact.
#
# Triggered by a `v*` tag, or manually. The CI workflow must be green
# first — it is a `needs:` dependency, not a hope.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The version tag to publish (v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/fuel-backend
  FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/fuel-frontend

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish images
    runs-on: ubuntu-latest
    needs: [] # filled in below by the guard job

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a vMAJOR.MINOR.PATCH tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG"

      - name: Build and push the backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.tag }}-sha-${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.tag }}-sha-${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise what was published
        run: |
          {
            echo "### Published"
            echo ""
            echo "| Image | Tags |"
            echo "|---|---|"
            echo "| \`${{ env.BACKEND_IMAGE }}\` | \`${{ steps.version.outputs.tag }}\`, \`${{ steps.version.outputs.tag }}-sha-${{ github.sha }}\`, \`latest\` |"
            echo "| \`${{ env.FRONTEND_IMAGE }}\` | \`${{ steps.version.outputs.tag }}\`, \`${{ steps.version.outputs.tag }}-sha-${{ github.sha }}\`, \`latest\` |"
            echo ""
            echo "### Rolling back"
            echo ""
            echo "Pull the previous \`-sha-\` tag and redeploy it:"
            echo ""
            echo '```bash'
            echo "docker pull ${{ env.BACKEND_IMAGE }}:v1.0.0-sha-<previous-sha>"
            echo "docker tag  ${{ env.BACKEND_IMAGE }}:v1.0.0-sha-<previous-sha> ${{ env.BACKEND_IMAGE }}:latest"
            echo "docker push ${{ env.BACKEND_IMAGE }}:latest"
            echo '```'
            echo ""
            echo "See \`docs/deployment.md\` for the full procedure."
          } >> "$GITHUB_STEP_SUMMARY"
