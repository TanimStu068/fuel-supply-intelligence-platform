name: fuel-supply-intelligence-platform

# ---------------------------------------------------------------------------
# Resource policy — this file is the contract with the machine it runs on.
# ---------------------------------------------------------------------------
# The host has 7.1 GB of RAM and about 2.5 GB free for Docker, and it is
# shared with several other projects' stacks. The platform used to be the
# reason the desktop froze: not because any one container was slow, but
# because the *scheduler* had no budget to work with.
#
# Four rules keep that from happening again:
#
#   1. Every service carries an explicit memory and CPU limit. A container
#      that leaks is killed at its limit instead of eating the host.
#   2. Every service rotates its logs. An unbounded json-file log on a
#      chatty service fills a disk and takes the whole daemon down.
#   3. The stack is split into two profiles, so the platform can run on its
#      own when the machine is tight:
#
#        core        simulator, backend, postgres, frontend   (~1.1 GB)
#        monitoring  prometheus, grafana, node-exporter        (~0.4 GB)
#
#      ``COMPOSE_PROFILES=core`` lives in .env, so a plain ``docker compose
#      up`` starts the platform and nothing else. The observability stack
#      is added explicitly:
#
#        docker compose --profile core --profile monitoring up -d
#
#   4. Prometheus keeps its retention bounded (2 days, 500 MB) instead of
#      growing until the disk is full.
#
# See docs/progress/day6.md ("Running the stack on a shared machine").

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # Organizer-provided simulator. The world we operate on; never modified.
  # ---------------------------------------------------------------------------
  simulator:
    image: ${SIMULATOR_IMAGE:-asifmahmoud414/bup-fuel-supply-simulator:1.0.0}
    container_name: fuel-simulator
    restart: unless-stopped
    profiles: ["core"]
    # The simulator's own pool is small (5 + 10 overflow). A hard memory
    # ceiling keeps a leak in it from reaching the host.
    mem_limit: ${SIMULATOR_MEM_LIMIT:-384m}
    cpus: ${SIMULATOR_CPUS:-0.75}
    pids_limit: 256
    logging: *default-logging
    environment:
      SIMULATOR_START_MODE: ${SIMULATOR_START_MODE:-paused}
      SIMULATION_SPEED: ${SIMULATION_SPEED:-8}
      TICK_MINUTES: ${TICK_MINUTES:-15}
    ports:
      - "${SIMULATOR_PORT:-8000}:8000"
    volumes:
      - simulator-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Participant backend (FastAPI).
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fuel-backend
    restart: unless-stopped
    profiles: ["core"]
    depends_on:
      postgres:
        condition: service_healthy
      simulator:
        condition: service_healthy
    environment:
      SIMULATOR_BASE_URL: http://simulator:8000
      SIMULATOR_REQUEST_TIMEOUT: ${SIMULATOR_REQUEST_TIMEOUT:-10}
      SIMULATOR_CONNECT_TIMEOUT: ${SIMULATOR_CONNECT_TIMEOUT:-3}
      SIMULATOR_MAX_RETRIES: ${SIMULATOR_MAX_RETRIES:-3}
      SIMULATOR_RETRY_BASE_DELAY: ${SIMULATOR_RETRY_BASE_DELAY:-0.2}
      SIMULATOR_RETRY_MAX_DELAY: ${SIMULATOR_RETRY_MAX_DELAY:-5}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fuel}:${POSTGRES_PASSWORD:-change-me-in-env}@postgres:5432/${POSTGRES_DB:-fuel}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      # --- resilience (Day 6) ---
      # The simulator's connection pool is small (5 + 10 overflow). Without
      # a breaker the backend's own retries exhaust it, which is how the
      # simulator used to be knocked over by the platform polling it.
      CIRCUIT_BREAKER_FAILURES: ${CIRCUIT_BREAKER_FAILURES:-5}
      CIRCUIT_BREAKER_RECOVERY_SECONDS: ${CIRCUIT_BREAKER_RECOVERY_SECONDS:-20}
      SIMULATOR_HEALTH_TIMEOUT: ${SIMULATOR_HEALTH_TIMEOUT:-2}
      SHUTDOWN_GRACE_SECONDS: ${SHUTDOWN_GRACE_SECONDS:-15}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
      # --- background sync (Day 2) ---
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      # The poll interval is deliberately long. The simulator's connection
      # pool is the platform's scarcest resource, and the SSE stream
      # already tells us when something changed — the poll is the safety
      # net, not the primary path.
      SYNC_POLL_INTERVAL: ${SYNC_POLL_INTERVAL:-15}
      # The shortest gap between two sync cycles, whatever asked for one.
      # The SSE stream fires a tick event several times a second; without
      # this the platform would read the whole world on every one of them.
      SYNC_MIN_INTERVAL: ${SYNC_MIN_INTERVAL:-3}
      # How many simulator calls may be in flight at once. The pool holds
      # fifteen connections and a cycle reads nine endpoints — so the
      # fan-out has to be bounded, or the platform exhausts the pool it is
      # reading from.
      SYNC_MAX_CONCURRENCY: ${SYNC_MAX_CONCURRENCY:-3}
      SSE_RECONNECT_BASE_DELAY: ${SSE_RECONNECT_BASE_DELAY:-1}
      SSE_RECONNECT_MAX_DELAY: ${SSE_RECONNECT_MAX_DELAY:-30}
      DEMAND_HISTORY_LIMIT: ${DEMAND_HISTORY_LIMIT:-500}
      # --- intelligence (Day 3) ---
      # How many ticks ahead the demand forecast reaches. 96 ticks is one
      # simulated day at the default 15-minute tick.
      FORECAST_HORIZON_TICKS: ${FORECAST_HORIZON_TICKS:-96}
      MODEL_TRAIN_INTERVAL: ${MODEL_TRAIN_INTERVAL:-300}
      # The prediction-error aggregate is computed in SQL. Set it to false
      # to reproduce the "before" side of the load test's bottleneck
      # comparison — see docs/load-test-report.md.
      PREDICTION_ERROR_AGGREGATE_IN_DATABASE: ${PREDICTION_ERROR_AGGREGATE_IN_DATABASE:-true}
      DISPATCH_ENABLED: ${DISPATCH_ENABLED:-true}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    # The backend is the one service that must always be up. It carries a
    # hard ceiling too: the platform has been seen holding ~250 MiB, and a
    # runaway leak should be killed rather than allowed to push the host
    # into swap.
    mem_limit: ${BACKEND_MEM_LIMIT:-384m}
    cpus: ${BACKEND_CPUS:-1.0}
    pids_limit: 256
    logging: *default-logging
    # The backend drains on SIGTERM: it stops reporting ready, finishes the
    # requests in flight, and closes its connections. The grace period is
    # longer than the drain, so Docker does not escalate to SIGKILL while a
    # request is still being served.
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Participant database (Postgres).
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: fuel-postgres
    restart: unless-stopped
    profiles: ["core"]
    # Postgres's shared buffers are the bulk of its footprint. Capping it
    # keeps the database inside a known budget instead of letting it grow
    # with the page cache.
    mem_limit: ${POSTGRES_MEM_LIMIT:-256m}
    cpus: ${POSTGRES_CPUS:-0.75}
    pids_limit: 256
    logging: *default-logging
    # A memory limit alone does not make Postgres small: it sizes its
    # buffers from the *host's* RAM. These settings are what actually put
    # the database inside its 256 MB budget.
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - work_mem=2MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fuel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-env}
      POSTGRES_DB: ${POSTGRES_DB:-fuel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fuel} -d ${POSTGRES_DB:-fuel}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Operator dashboard (React + Vite).
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fuel-frontend
    restart: unless-stopped
    profiles: ["core"]
    # The dashboard is a static bundle served by a tiny node server. It
    # needs almost nothing, and saying so stops it competing for memory
    # with the backend.
    mem_limit: ${FRONTEND_MEM_LIMIT:-64m}
    cpus: ${FRONTEND_CPUS:-0.25}
    pids_limit: 128
    logging: *default-logging
    depends_on:
      backend:
        condition: service_started
    environment:
      API_BASE_URL: http://localhost:${BACKEND_PORT:-8001}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Observability — the ``monitoring`` profile.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: fuel-prometheus
    restart: unless-stopped
    # Prometheus keeps a time series per container, so it is the one service
    # that grows with the number of running containers. It is capped and
    # lives behind the ``monitoring`` profile.
    mem_limit: ${PROMETHEUS_MEM_LIMIT:-192m}
    cpus: ${PROMETHEUS_CPUS:-0.5}
    pids_limit: 128
    logging: *default-logging
    profiles: ["monitoring"]
    depends_on:
      backend:
        condition: service_started
        required: false
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      # Bounded retention: two days, and never more than 500 MB on disk.
      - "--storage.tsdb.retention.time=2d"
      - "--storage.tsdb.retention.size=500MB"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # The alert rules are mounted from the repository, so a rule is code
      # rather than something configured through the UI.
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    image: grafana/grafana:11.2.0
    container_name: fuel-grafana
    restart: unless-stopped
    mem_limit: ${GRAFANA_MEM_LIMIT:-192m}
    cpus: ${GRAFANA_CPUS:-0.5}
    pids_limit: 128
    logging: *default-logging
    profiles: ["monitoring"]
    depends_on:
      prometheus:
        condition: service_healthy
        required: false
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-in-env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "5s"
      # The provisioning files are read from disk at start, so nothing here
      # is configured by hand.
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Host CPU and memory. node-exporter reads the kernel's own counters, so
  # the host's vitals land in Prometheus without touching the application.
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: fuel-node-exporter
    restart: unless-stopped
    mem_limit: ${NODE_EXPORTER_MEM_LIMIT:-32m}
    cpus: ${NODE_EXPORTER_CPUS:-0.1}
    pids_limit: 64
    logging: *default-logging
    profiles: ["monitoring"]
    command:
      # The host's root is mounted read-only and every path is read through
      # it, so the numbers are the host's and not the container's.
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|run|etc|host)($$|/)"
    volumes:
      - /:/host:ro,rslave
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9100/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  simulator-data:
  postgres-data:
  prometheus-data:
  grafana-data:
